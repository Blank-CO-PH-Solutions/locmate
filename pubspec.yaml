name: locmate
description: "Locmate - a location sharing app for your circle."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  battery_plus: ^7.1.2
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  geolocator: ^14.1.2
  google_maps_flutter: ^2.19.0
  http: ^1.6.0
  intl: ^0.20.3
  latlong2: ^0.10.1
  material_ui: ^1.11.0
  provider: ^6.1.5+1
  purchases_flutter: ^11.0.2
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  vibration: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/locmate_logo.png
    - assets/legal/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon/app_icon.png
  color_dark: "#0F0D16"
  image_dark: assets/icon/app_icon.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#FFFFFF"
    image: assets/icon/app_icon.png
    color_dark: "#0F0D16"
    image_dark: assets/icon/app_icon.png
